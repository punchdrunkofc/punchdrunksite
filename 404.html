<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST // SIGNAL NOT FOUND</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto !important; }
  .lost-page {
    max-width: 700px;
    margin: 80px auto;
    padding: 30px 20px;
    text-align: center;
    position: relative;
    z-index: 10;
  }
  .lost-page h1 {
    font-size: 72px;
    color: #a020f0;
    letter-spacing: 10px;
    text-shadow: 0 0 20px #a020f0, 0 0 40px #7b2cbf;
    margin-bottom: 10px;
    animation: flicker 3s infinite;
  }
  .lost-page .code {
    color: #4a4055;
    font-size: 12px;
    letter-spacing: 5px;
    margin-bottom: 50px;
  }
  .lost-page p {
    color: #c8c8d0;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 14px;
  }
  .lost-page .whisper {
    color: #5a3a6a;
    font-style: italic;
    opacity: 0.85;
    margin-bottom: 30px;
  }
  .countdown {
    font-size: 48px;
    color: #a020f0;
    letter-spacing: 8px;
    text-shadow: 0 0 15px #a020f0;
    margin: 30px 0;
    animation: pulse-count 1s infinite;
  }
  @keyframes pulse-count {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .redirect-note {
    color: #4a4055;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 30px;
  }
  .lost-back {
    display: inline-block;
    color: #a020f0;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 3px;
    border: 1px solid #a020f0;
    padding: 12px 24px;
    transition: all 0.3s;
    margin-top: 20px;
  }
  .lost-back:hover {
    background: #a020f0;
    color: #0a0a0f;
    box-shadow: 0 0 30px #a020f0;
  }
  .glitch-line {
    color: #2a2030;
    font-size: 11px;
    letter-spacing: 4px;
    margin-top: 60px;
    animation: flicker 5s infinite;
  }
  .hidden-comment {
    color: #0a0a0f;
    font-size: 10px;
    margin-top: 40px;
    letter-spacing: 3px;
    transition: color 0.5s;
  }
  .hidden-comment:hover { color: #a020f0; }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<main class="lost-page">
  <h1>404</h1>
  <div class="code">// SIGNAL LOST // NODE UNREACHABLE</div>

  <p>&gt; you went too far.</p>
  <p>&gt; this node was never part of the wheel.</p>
  <p class="whisper">or maybe it was. and someone erased it.</p>

  <div class="countdown" id="countdown">5</div>
  <div class="redirect-note">RETURNING TO NODE_07 IN</div>

  <a href="index.html" class="lost-back">&larr; RETURN NOW</a>

  <div class="glitch-line">
    ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░
  </div>
  <div class="hidden-comment" title="you found it">flag: l0st_but_n0t_f0rg0tt3n</div>
</main>

<script>
  let n = 5;
  const el = document.getElementById("countdown");
  const timer = setInterval(() => {
    n--;
    el.textContent = n;

    if (n <= 3 && n > 0) {
      el.style.transform = "translate(" + (Math.random() * 6 - 3) + "px," +
                                          (Math.random() * 6 - 3) + "px)";
      setTimeout(() => el.style.transform = "translate(0)", 100);
    }

    if (n <= 0) {
      clearInterval(timer);
      window.location.href = "index.html";
    }
  }, 1000);
</script>

</body>
</html>
