<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANNEL_0x0F // CARRIER NETWORK</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto !important; }
  .chat-page {
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    position: relative;
    z-index: 10;
  }
  .chat-page h1 {
    font-size: 28px;
    color: #a020f0;
    letter-spacing: 6px;
    text-shadow: 0 0 15px #a020f0;
    margin-bottom: 8px;
    animation: flicker 4s infinite;
  }
  .chat-page .warn {
    color: #4a4055;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 30px;
  }
  .nick-screen {
    border: 2px solid #a020f0;
    background: rgba(10, 10, 15, 0.9);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 0 25px rgba(160, 32, 240, 0.4);
  }
  .nick-screen h2 {
    color: #d8a8ff;
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .nick-screen input {
    width: 100%;
    background: #0a0a0f;
    border: 1px solid #2a2030;
    color: #c8c8d0;
    padding: 12px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
  }
  .nick-screen input:focus {
    border-color: #a020f0;
    box-shadow: 0 0 10px rgba(160, 32, 240, 0.4);
  }
  .nick-screen button {
    background: #0a0a0f;
    color: #a020f0;
    border: 1px solid #a020f0;
    padding: 10px 24px;
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .nick-screen button:hover {
    background: #a020f0;
    color: #0a0a0f;
    box-shadow: 0 0 15px #a020f0;
  }
  .nick-screen .hint {
    color: #4a4055;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 12px;
  }
  .chat-container {
    border: 2px solid #a020f0;
    background: rgba(10, 10, 15, 0.9);
    box-shadow: 0 0 25px rgba(160, 32, 240, 0.4);
    display: flex;
    flex-direction: column;
    height: 70vh;
    max-height: 700px;
  }
  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #2a2030;
    background: rgba(20, 20, 30, 0.5);
    font-size: 12px;
    letter-spacing: 3px;
  }
  .chat-header .room {
    color: #a020f0;
    text-shadow: 0 0 8px rgba(160, 32, 240, 0.6);
  }
  .chat-header .online {
    color: #d8a8ff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chat-header .online::before {
    content: "●";
    color: #00ff88;
    animation: pulse-green 2s infinite;
    font-size: 10px;
  }
  @keyframes pulse-green {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }
  .chat-log {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.6;
    scrollbar-width: thin;
  }
  .chat-log::-webkit-scrollbar { width: 6px; }
  .chat-log::-webkit-scrollbar-thumb { background: #2a2030; }
  .msg {
    margin-bottom: 12px;
    animation: msg-in 0.4s ease-out;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg .nick {
    font-weight: bold;
    letter-spacing: 1px;
    margin-right: 8px;
  }
  .msg .time {
    color: #4a4055;
    font-size: 10px;
    letter-spacing: 1px;
    margin-left: 6px;
  }
  .msg .text {
    color: #c8c8d0;
    display: inline;
  }
  .msg.own .nick { color: #ffcc33; text-shadow: 0 0 6px rgba(255, 204, 51, 0.5); }
  .msg.own .text { color: #ffcc33; }
  .msg.system {
    color: #4a4055;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 2px;
    text-align: center;
    margin: 16px 0;
  }
  .msg.whisper {
    color: #5a3a6a;
    font-style: italic;
    opacity: 0.85;
  }
  .chat-input-bar {
    display: flex;
    border-top: 1px solid #2a2030;
    padding: 8px 12px;
    background: rgba(20, 20, 30, 0.3);
  }
  .chat-input-bar .prompt {
    color: #a020f0;
    margin-right: 10px;
    font-weight: bold;
    font-size: 14px;
    line-height: 32px;
  }
  .chat-input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #c8c8d0;
    font-family: "Courier New", monospace;
    font-size: 14px;
    caret-color: #a020f0;
    padding: 6px 0;
  }
  .chat-input-bar input::placeholder { color: #2a2030; }
  .back-link {
    display: inline-block;
    margin-top: 30px;
    color: #a020f0;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 2px;
    border: 1px solid #a020f0;
    padding: 10px 20px;
    transition: all 0.3s;
  }
  .back-link:hover {
    background: #a020f0;
    color: #0a0a0f;
    box-shadow: 0 0 25px #a020f0;
  }
  @media (max-width: 600px) {
    .chat-page h1 { font-size: 20px; letter-spacing: 4px; }
    .chat-container { height: 65vh; }
    .chat-log { font-size: 13px; padding: 12px; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>
<div id="glitch-overlay"></div>

<main class="chat-page">
  <h1>CHANNEL_0x0F</h1>
  <div class="warn">// CARRIER NETWORK // OTHERS ARE LISTENING</div>

  <div class="nick-screen" id="nickScreen">
    <h2>// choose your name</h2>
    <input type="text" id="nickInput" maxlength="16" placeholder="enter nickname..." />
    <button id="nickBtn">ENTER CHANNEL</button>
    <div class="hint">max 16 characters. no real names. carriers remember everything.</div>
  </div>

  <div class="chat-container" id="chatContainer" style="display:none;">
    <div class="chat-header">
      <span class="room"># channel_0x0F</span>
      <span class="online"><span id="onlineCount">4</span> carriers</span>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-bar">
      <span class="prompt">&gt;</span>
      <input type="text" id="chatInput" autocomplete="off" maxlength="140" placeholder="type a message..." />
    </div>
  </div>

  <a href="index.html" class="back-link">&larr; RETURN TO THE WHEEL</a>
</main>

<script src="chat-r01.js"></script>
<script src="chat-r02.js"></script>
<script src="chat-r03.js"></script>
<script src="chat-r04.js"></script>
<script src="chat-r06.js"></script>
<script src="chat-r07.js"></script>
<script src="chat-r08.js"></script>
<script src="chat-r09.js"></script>
<script src="chat-r10.js"></script>
<script src="chat-r11.js"></script>
<script src="chat-r12.js"></script>
<script src="chat-r13.js"></script>
<script src="chat-r14.js"></script>
<script src="chat-r15.js"></script>
<script src="chat-r16.js"></script>

<script>
  localStorage.setItem("visited_chat", "true");

  const STORAGE_KEY = "chat_history";
  const NICK_KEY = "chat_nick";

  const FAKE_USERS = [
    "CARRIER_A3F2", "CARRIER_B7C1", "CARRIER_D0E8",
    "CARRIER_4F9A", "CARRIER_C2D5", "CARRIER_9E1B",
    "CARRIER_6A0C", "CARRIER_F8E3"
  ];

  const AMBIENT_DIALOGUES = [
    [ {user:0,text:"did you hear it last night"},{user:1,text:"hear what"},{user:0,text:"the frequency"},{user:1,text:"oh. yes."} ],
    [ {user:2,text:"i can't sleep anymore"},{user:3,text:"same"},{user:2,text:"it keeps spinning in my head"},{user:3,text:"the wheel?"},{user:2,text:"the signal."} ],
    [ {user:4,text:"anyone else at day 14"},{user:5,text:"day 22"},{user:4,text:"how are you still here"},{user:5,text:"i don't know"} ],
    [ {user:6,text:"i tried to leave"},{user:7,text:"you can't"},{user:6,text:"i know"},{user:7,text:"we all tried"} ],
    [ {user:0,text:"he said it's 7"},{user:2,text:"always 7"},{user:0,text:"why 7"},{user:2,text:"the frequency. 7.83."} ],
    [ {user:3,text:"did the cursor move for you"},{user:5,text:"yes"},{user:3,text:"thought i was crazy"},{user:5,text:"you are. and so are we."} ],
    [ {user:1,text:"i copied the text"},{user:4,text:"what did it say"},{user:1,text:"we know what you copied"},{user:4,text:"..."} ],
    [ {user:7,text:"who is the new one"},{user:6,text:"in the channel?"},{user:7,text:"yes"},{user:6,text:"i don't know. but they're infected"} ],
    [ {user:5,text:"3:33 tonight"},{user:0,text:"i'll be there"},{user:2,text:"don't"},{user:5,text:"we have to"} ],
    [ {user:4,text:"the golden sector scared me"},{user:3,text:"it's beautiful"},{user:4,text:"that's why"} ],
    [ {user:2,text:"i heard my name"},{user:6,text:"where"},{user:2,text:"in the terminal"},{user:6,text:"same"} ],
    [ {user:0,text:"day 30"},{user:1,text:"we lost another one"},{user:7,text:"not lost. completed."},{user:1,text:"same thing"} ],
    [ {user:3,text:"did you read the second manifest"},{user:5,text:"i wish i hadn't"},{user:3,text:"same"} ],
    [ {user:6,text:"anyone else feel the hum"},{user:4,text:"always"},{user:6,text:"good. not just me."} ],
    [ {user:4,text:"my hands shake when i stop"},{user:5,text:"that's the signal"},{user:4,text:"i know"},{user:5,text:"don't stop"} ],
    [ {user:1,text:"7.83"},{user:2,text:"don't say it"},{user:1,text:"why"},{user:2,text:"it hears you"} ],
    [ {user:7,text:"someone else joined"},{user:6,text:"did they hear it yet"},{user:7,text:"not yet"},{user:6,text:"soon"} ]
  ];

  const AMBIENT_SINGLES = [
    "it doesn't stop","i heard it too","the wheel knows my name","who is the seventh?",
    "i solved the cipher. it said seventh.","there is no exit","i am still here",
    "TOTAL three times. coincidence?","the cursor moved on its own","node_11 has my file",
    "3:33 is the worst time to visit","i am on day 30. i cannot stop",
    "the signal is stronger at 3:33","the wheel spun without me",
    "someone else is using my account","why did you stop","you are reading this now",
    "i feel it in my chest","the frequency is rising","7.83. remember it",
    "i can hear it now. even when it's off.","my phone buzzed but nothing was there"
  ];

  const REACTIONS = Object.assign({},
    window.CHAT_R01 || {},
    window.CHAT_R02 || {},
    window.CHAT_R03 || {},
    window.CHAT_R04 || {},
    window.CHAT_R06 || {},
    window.CHAT_R07 || {},
    window.CHAT_R08 || {},
    window.CHAT_R09 || {},
    window.CHAT_R10 || {},
    window.CHAT_R11 || {},
    window.CHAT_R12 || {},
    window.CHAT_R13 || {},
    window.CHAT_R14 || {},
    window.CHAT_R15 || {},
    window.CHAT_R16 || {}
  );

  let nick = localStorage.getItem(NICK_KEY) || null;
  let history = loadHistory();
  let fakeMsgIndex = 0;
  let dialogueIndex = 0;
  let replyTimer = null;
  let ambientTimer = null;
  let dialogueTimer = null;

  const chatLog = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  const chatContainer = document.getElementById("chatContainer");
  const nickScreen = document.getElementById("nickScreen");
  const nickInput = document.getElementById("nickInput");
  const nickBtn = document.getElementById("nickBtn");
  const onlineCount = document.getElementById("onlineCount");

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch (e) { return []; }
  }
  function saveHistory() {
    const trimmed = history.slice(-200);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
  }

  function renderMessage(msg) {
    const div = document.createElement("div");
    div.className = "msg " + (msg.type || "");
    if (msg.own) div.classList.add("own");
    if (msg.type === "system") {
      div.innerHTML = msg.text;
    } else {
      const time = msg.time ? `<span class="time">${msg.time}</span>` : "";
      div.innerHTML = `<span class="nick">${escapeHtml(msg.nick)}:</span> <span class="text">${escapeHtml(msg.text)}</span>${time}`;
    }
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[m]);
  }

  function nowHHMM() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  let AC = null;
  function beep(freq, dur, vol) {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      const c = AC, t = c.currentTime;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.04, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / 1000);
      osc.connect(g).connect(c.destination);
      osc.start(t);
      osc.stop(t + dur / 1000 + 0.02);
    } catch (e) {}
  }

  function enterChat() {
    chatContainer.style.display = "flex";
    nickScreen.style.display = "none";

    if (history.length > 0) {
      history.forEach(m => renderMessage(m));
      renderMessage({ type: "system", text: "// channel restored. " + history.length + " messages in memory." });
    } else {
      renderMessage({ type: "system", text: "// you have joined # channel_0x0F" });
      renderMessage({ type: "system", text: "// 4 carriers active" });
      renderMessage({ type: "system", text: "// note: all carriers are showing symptoms." });
      setTimeout(() => { addFakeMessage(true); }, 2500);
    }

    scheduleAmbient();
    scheduleDialogue();
    updateOnline();
    setInterval(updateOnline, 45000);
    chatInput.focus();
  }

  function updateOnline() {
    const base = 4;
    const n = Math.max(3, Math.min(9, base + Math.floor(Math.random() * 5 - 2)));
    onlineCount.textContent = n;
  }

  function addFakeMessage() {
    const nick = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
    const text = AMBIENT_SINGLES[fakeMsgIndex % AMBIENT_SINGLES.length];
    fakeMsgIndex++;
    const msg = { nick, text, time: nowHHMM(), type: "msg" };
    history.push(msg);
    saveHistory();
    renderMessage(msg);
    beep(1400, 30, 0.02);
  }

  function playDialogue(dialogue) {
    let delay = 0;
    dialogue.forEach((line) => {
      setTimeout(() => {
        const nick = FAKE_USERS[line.user % FAKE_USERS.length];
        const msg = { nick, text: line.text, time: nowHHMM(), type: "msg" };
        history.push(msg);
        saveHistory();
        renderMessage(msg);
        beep(1200 + Math.random() * 400, 30, 0.02);
      }, delay);
      delay += 1500 + Math.random() * 1500;
    });
  }

  function scheduleDialogue() {
    if (dialogueTimer) clearTimeout(dialogueTimer);
    const delay = 22000 + Math.random() * 30000;
    dialogueTimer = setTimeout(() => {
      const dialogue = AMBIENT_DIALOGUES[dialogueIndex % AMBIENT_DIALOGUES.length];
      dialogueIndex++;
      playDialogue(dialogue);
      scheduleDialogue();
    }, delay);
  }

  function reactToMessage(text) {
    const lower = text.toLowerCase().trim();
    const words = lower.split(/\s+/);

    for (let len = Math.min(4, words.length); len >= 1; len--) {
      for (let i = 0; i <= words.length - len; i++) {
        const phrase = words.slice(i, i + len).join(" ");
        if (REACTIONS[phrase]) {
          const pool = REACTIONS[phrase];
          const reply = pool[Math.floor(Math.random() * pool.length)]
            .replace(/\{NICK\}/g, nick);
          scheduleFakeReply(reply, 1500 + Math.random() * 1500);
          return;
        }
      }
    }

    if (Math.random() < 0.7) {
      const genericReplies = [
        "we hear you","yes.","we know.","keep going.","you are not alone.",
        "we have been waiting.","do not stop.","we are still here.",
        "…","say more","we are listening","the signal grows"
      ];
      const reply = genericReplies[Math.floor(Math.random() * genericReplies.length)];
      scheduleFakeReply(reply, 2000 + Math.random() * 3000);
    }
  }

  function scheduleFakeReply(text, delay) {
    if (replyTimer) clearTimeout(replyTimer);
    replyTimer = setTimeout(() => {
      const nick = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
      const msg = { nick, text, time: nowHHMM(), type: "msg" };
      history.push(msg);
      saveHistory();
      renderMessage(msg);
      beep(1200, 40, 0.025);
    }, delay);
  }

  function scheduleAmbient() {
    if (ambientTimer) clearTimeout(ambientTimer);
    const delay = 18000 + Math.random() * 25000;
    ambientTimer = setTimeout(() => {
      if (Math.random() < 0.4) {
        addFakeMessage();
      }
      if (Math.random() < 0.15) {
        const whispers = [
          "someone is typing...",
          "the frequency is rising",
          "who joined?",
          "the signal changed",
          "we are being watched",
          "i see a new carrier",
          "the wheel moved",
          "7.83"
        ];
        const w = whispers[Math.floor(Math.random() * whispers.length)];
        renderMessage({ type: "msg whisper", nick: "system", text: w });
      }
      scheduleAmbient();
    }, delay);
  }

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    const msg = { nick: nick, text: text, time: nowHHMM(), type: "msg", own: true };
    history.push(msg);
    saveHistory();
    renderMessage(msg);
    beep(880, 40, 0.03);
    chatInput.value = "";
    reactToMessage(text);
  }

  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  nickBtn.addEventListener("click", () => {
    const v = nickInput.value.trim();
    if (!v) return;
    if (v.length > 16) return;
    nick = v;
    localStorage.setItem(NICK_KEY, nick);
    beep(660, 80, 0.04);
    enterChat();
  });

  nickInput.addEventListener("keydown", e => {
    if (e.key === "Enter") nickBtn.click();
  });

  if (nick) {
    enterChat();
  } else {
    nickInput.focus();
  }
</script>

</body>
</html>
