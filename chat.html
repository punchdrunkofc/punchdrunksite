<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOM_0x0F // LIVE CHANNEL</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto !important; }
  .chat-page {
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    position: relative;
    z-index: 10;
  }
  .chat-page h1 {
    font-size: 28px;
    color: #a020f0;
    letter-spacing: 6px;
    text-shadow: 0 0 15px #a020f0;
    margin-bottom: 8px;
    animation: flicker 4s infinite;
  }
  .chat-page .warn {
    color: #4a4055;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 30px;
  }

  /* ---------- ВЫБОР НИКА ---------- */
  .nick-screen {
    border: 2px solid #a020f0;
    background: rgba(10, 10, 15, 0.9);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 0 25px rgba(160, 32, 240, 0.4);
  }
  .nick-screen h2 {
    color: #d8a8ff;
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .nick-screen input {
    width: 100%;
    background: #0a0a0f;
    border: 1px solid #2a2030;
    color: #c8c8d0;
    padding: 12px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
  }
  .nick-screen input:focus {
    border-color: #a020f0;
    box-shadow: 0 0 10px rgba(160, 32, 240, 0.4);
  }
  .nick-screen button {
    background: #0a0a0f;
    color: #a020f0;
    border: 1px solid #a020f0;
    padding: 10px 24px;
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .nick-screen button:hover {
    background: #a020f0;
    color: #0a0a0f;
    box-shadow: 0 0 15px #a020f0;
  }
  .nick-screen .hint {
    color: #4a4055;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 12px;
  }

  /* ---------- ЧАТ ---------- */
  .chat-container {
    border: 2px solid #a020f0;
    background: rgba(10, 10, 15, 0.9);
    box-shadow: 0 0 25px rgba(160, 32, 240, 0.4);
    display: flex;
    flex-direction: column;
    height: 70vh;
    max-height: 700px;
  }

  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #2a2030;
    background: rgba(20, 20, 30, 0.5);
    font-size: 12px;
    letter-spacing: 3px;
  }
  .chat-header .room {
    color: #a020f0;
    text-shadow: 0 0 8px rgba(160, 32, 240, 0.6);
  }
  .chat-header .online {
    color: #d8a8ff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chat-header .online::before {
    content: "●";
    color: #00ff88;
    animation: pulse-green 2s infinite;
    font-size: 10px;
  }
  @keyframes pulse-green {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  .chat-log {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.6;
    scrollbar-width: thin;
  }
  .chat-log::-webkit-scrollbar { width: 6px; }
  .chat-log::-webkit-scrollbar-thumb { background: #2a2030; }

  .msg {
    margin-bottom: 12px;
    animation: msg-in 0.4s ease-out;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg .nick {
    font-weight: bold;
    letter-spacing: 1px;
    margin-right: 8px;
  }
  .msg .time {
    color: #4a4055;
    font-size: 10px;
    letter-spacing: 1px;
    margin-left: 6px;
  }
  .msg .text {
    color: #c8c8d0;
    display: inline;
  }
  .msg.own .nick { color: #ffcc33; text-shadow: 0 0 6px rgba(255, 204, 51, 0.5); }
  .msg.own .text { color: #ffcc33; }
  .msg.system {
    color: #4a4055;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 2px;
    text-align: center;
    margin: 16px 0;
  }
  .msg.whisper {
    color: #5a3a6a;
    font-style: italic;
    opacity: 0.85;
  }

  .chat-input-bar {
    display: flex;
    border-top: 1px solid #2a2030;
    padding: 8px 12px;
    background: rgba(20, 20, 30, 0.3);
  }
  .chat-input-bar .prompt {
    color: #a020f0;
    margin-right: 10px;
    font-weight: bold;
    font-size: 14px;
    line-height: 32px;
  }
  .chat-input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #c8c8d0;
    font-family: "Courier New", monospace;
    font-size: 14px;
    caret-color: #a020f0;
    padding: 6px 0;
  }
  .chat-input-bar input::placeholder { color: #2a2030; }

  .back-link {
    display: inline-block;
    margin-top: 30px;
    color: #a020f0;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 2px;
    border: 1px solid #a020f0;
    padding: 10px 20px;
    transition: all 0.3s;
  }
  .back-link:hover {
    background: #a020f0;
    color: #0a0a0f;
    box-shadow: 0 0 25px #a020f0;
  }

  /* ---------- МОБИЛЬНАЯ ---------- */
  @media (max-width: 600px) {
    .chat-page h1 { font-size: 20px; letter-spacing: 4px; }
    .chat-container { height: 65vh; }
    .chat-log { font-size: 13px; padding: 12px; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>
<div id="glitch-overlay"></div>

<main class="chat-page">
  <h1>ROOM_0x0F</h1>
  <div class="warn">// LIVE CHANNEL // OTHERS ARE LISTENING</div>

  <!-- Экран выбора ника -->
  <div class="nick-screen" id="nickScreen">
    <h2>// choose your name</h2>
    <input type="text" id="nickInput" maxlength="16" placeholder="enter nickname..." />
    <button id="nickBtn">ENTER ROOM</button>
    <div class="hint">max 16 characters. no real names. they remember everything.</div>
  </div>

  <!-- Сам чат -->
  <div class="chat-container" id="chatContainer" style="display:none;">
    <div class="chat-header">
      <span class="room"># channel_0x0F</span>
      <span class="online"><span id="onlineCount">4</span> online</span>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-bar">
      <span class="prompt">&gt;</span>
      <input type="text" id="chatInput" autocomplete="off" maxlength="140" placeholder="type a message..." />
    </div>
  </div>

  <a href="index.html" class="back-link">&larr; RETURN TO THE WHEEL</a>
</main>

<script>
  // ==================================================================
  //  FAKE CHAT — no real server, no real users
  //  "Others" are pre-written lines from a pool. Player sees only
  //  their own messages + simulated replies.
  // ==================================================================

  const STORAGE_KEY = "chat_history";
  const NICK_KEY = "chat_nick";

  // ---------- СЛОВАРЬ "ЧУЖИХ" СООБЩЕНИЙ ----------
  const FAKE_USERS = [
    "SUBJECT_A3F2", "SUBJECT_B7C1", "SUBJECT_D0E8",
    "SUBJECT_4F9A", "SUBJECT_C2D5", "SUBJECT_9E1B",
    "SUBJECT_6A0C", "SUBJECT_F8E3"
  ];

  // фразы-заготовки. Идут "по кругу" по мере активности игрока.
  const FAKE_MESSAGES = [
    "it doesn't stop",
    "i heard it too",
    "the wheel knows my name",
    "who is the seventh?",
    "i solved the cipher. it said seventh.",
    "there is no exit",
    "they answered when i typed why",
    "i am still here",
    "TOTAL three times. coincidence?",
    "the cursor moved on its own",
    "i tried to copy the text",
    "node_11 has my file",
    "do not trust the golden sector",
    "3:33 is the worst time to visit",
    "if you find my file - delete it",
    "i am on day 30. i cannot stop",
    "they know my IP",
    "do not open the second manifest",
    "the signal is stronger at 3:33",
    "i left my voice in visitors",
    "the wheel spun without me",
    "someone else is using my account",
    "why did you stop",
    "you are reading this now",
    "it copied what you wrote"
  ];

  // специальные ответы на триггерные слова игрока
  const REACTIONS = {
    "help": [
      "there is no help here",
      "you are already helping",
      "help is a word. not a state."
    ],
    "who": [
      "you know who",
      "we cannot say. they are listening",
      "the ones who erased node 0x00"
    ],
    "why": [
      "because you keep spinning",
      "because we are still here",
      "because it is not over"
    ],
    "hello": [
      "hello. you said that last time",
      "we were waiting for you",
      "hello, {NICK}."
    ],
    "stop": [
      "you cannot stop. neither can we",
      "stop is what they told us too"
    ],
    "7": [
      "seven. yes. you understand",
      "the seventh is not a person",
      "we are all the seventh"
    ]
  };

  // ---------- СОСТОЯНИЕ ----------
  let nick = localStorage.getItem(NICK_KEY) || null;
  let history = loadHistory();
  let fakeMsgIndex = 0;
  let replyTimer = null;
  let ambientTimer = null;

  const chatLog = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  const chatContainer = document.getElementById("chatContainer");
  const nickScreen = document.getElementById("nickScreen");
  const nickInput = document.getElementById("nickInput");
  const nickBtn = document.getElementById("nickBtn");
  const onlineCount = document.getElementById("onlineCount");

  // ---------- ЗАГРУЗКА ИСТОРИИ ----------
  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveHistory() {
    // храним последние 200 сообщений
    const trimmed = history.slice(-200);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
  }

  // ---------- ОТОБРАЖЕНИЕ СООБЩЕНИЯ ----------
  function renderMessage(msg) {
    const div = document.createElement("div");
    div.className = "msg " + (msg.type || "");
    if (msg.own) div.classList.add("own");

    if (msg.type === "system") {
      div.innerHTML = msg.text;
    } else {
      const time = msg.time ? `<span class="time">${msg.time}</span>` : "";
      div.innerHTML = `<span class="nick">${escapeHtml(msg.nick)}:</span> <span class="text">${escapeHtml(msg.text)}</span>${time}`;
    }

    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[m]);
  }

  // ---------- ВРЕМЯ ----------
  function nowHHMM() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  // ---------- ЗВУК ----------
  let AC = null;
  function beep(freq, dur, vol) {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      const c = AC, t = c.currentTime;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.04, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / 1000);
      osc.connect(g).connect(c.destination);
      osc.start(t);
      osc.stop(t + dur / 1000 + 0.02);
    } catch (e) {}
  }

  // ---------- ЗАПУСК ЧАТА ----------
  function enterChat() {
    chatContainer.style.display = "flex";
    nickScreen.style.display = "none";

    // восстанавливаем историю
    if (history.length > 0) {
      history.forEach(m => renderMessage(m));
      renderMessage({ type: "system", text: "// session restored. " + history.length + " messages in memory." });
    } else {
      // первое сообщение — "приветствие"
      renderMessage({ type: "system", text: "// you have joined # channel_0x0F" });
      renderMessage({ type: "system", text: "// 4 users online" });

      setTimeout(() => {
        addFakeMessage(true);
      }, 2500);
    }

    // случайные "чужие" сообщения каждые 15–40 секунд
    scheduleAmbient();

    // обновление "онлайн"
    updateOnline();
    setInterval(updateOnline, 45000);

    chatInput.focus();
  }

  // ---------- "ОНЛАЙН" ----------
  function updateOnline() {
    // 3–7 человек. Медленно меняется.
    const base = 4;
    const n = Math.max(3, Math.min(7, base + Math.floor(Math.random() * 4 - 1)));
    onlineCount.textContent = n;
  }

  // ---------- ДОБАВИТЬ "ЧУЖОЕ" СООБЩЕНИЕ ----------
  function addFakeMessage(initial) {
    if (history.length > 0 && !initial) {
      // не добавляем если игрок молчит и в чате тишина
    }

    const nick = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
    const text = FAKE_MESSAGES[fakeMsgIndex % FAKE_MESSAGES.length];
    fakeMsgIndex++;

    const msg = {
      nick, text, time: nowHHMM(),
      type: "msg"
    };

    history.push(msg);
    saveHistory();
    renderMessage(msg);

    // тихий "писк" как будто кто-то печатает
    beep(1400, 30, 0.02);
  }

  // ---------- РЕАКЦИЯ НА СООБЩЕНИЕ ИГРОКА ----------
  function reactToMessage(text) {
    const lower = text.toLowerCase().trim();
    const words = lower.split(/\s+/);

    // проверяем триггерные слова
    for (const w of words) {
      if (REACTIONS[w]) {
        const pool = REACTIONS[w];
        const reply = pool[Math.floor(Math.random() * pool.length)]
          .replace("{NICK}", nick);
        scheduleFakeReply(reply, 1500 + Math.random() * 1500);
        return;
      }
    }

    // отвечаем "эхом" на сообщения игрока через 2–5 секунд
    if (Math.random() < 0.6) {
      const genericReplies = [
        "we hear you",
        "yes.",
        "we know.",
        "keep going.",
        "you are not alone.",
        "we have been waiting.",
        "it has already begun.",
        "do not stop."
      ];
      const reply = genericReplies[Math.floor(Math.random() * genericReplies.length)];
      scheduleFakeReply(reply, 2000 + Math.random() * 3000);
    }
  }

  // ---------- ОТЛОЖЕННЫЙ ОТВЕТ ----------
  function scheduleFakeReply(text, delay) {
    if (replyTimer) clearTimeout(replyTimer);
    replyTimer = setTimeout(() => {
      const nick = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
      const msg = { nick, text, time: nowHHMM(), type: "msg" };
      history.push(msg);
      saveHistory();
      renderMessage(msg);
      beep(1200, 40, 0.025);
    }, delay);
  }

  // ---------- "ТИХИЙ" ФОН КАЖДЫЕ 15–40 СЕК ----------
  function scheduleAmbient() {
    if (ambientTimer) clearTimeout(ambientTimer);
    const delay = 15000 + Math.random() * 25000;
    ambientTimer = setTimeout(() => {
      // 50% шанс добавить чужое сообщение
      if (Math.random() < 0.5) {
        addFakeMessage();
      }
      // 15% шанс добавить "шёпот"
      if (Math.random() < 0.15) {
        const whispers = [
          "someone is typing...",
          "it is very quiet in here",
          "who joined?",
          "the signal changed",
          "we are being watched",
          "i see a new name"
        ];
        const w = whispers[Math.floor(Math.random() * whispers.length)];
        renderMessage({ type: "msg whisper", nick: "system", text: w });
      }
      scheduleAmbient();
    }, delay);
  }

  // ---------- ОТПРАВКА СООБЩЕНИЯ ----------
  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    const msg = {
      nick: nick,
      text: text,
      time: nowHHMM(),
      type: "msg",
      own: true
    };

    history.push(msg);
    saveHistory();
    renderMessage(msg);

    beep(880, 40, 0.03);

    chatInput.value = "";

    // реакция через 1.5–5 сек
    reactToMessage(text);
  }

  // ---------- СОБЫТИЯ ----------
  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  // ---------- НИК ----------
  nickBtn.addEventListener("click", () => {
    const v = nickInput.value.trim();
    if (!v) return;
    if (v.length > 16) return;

    nick = v;
    localStorage.setItem(NICK_KEY, nick);

    beep(660, 80, 0.04);
    enterChat();
  });

  nickInput.addEventListener("keydown", e => {
    if (e.key === "Enter") nickBtn.click();
  });

  // ---------- ЕСЛИ НИК УЖЕ ВЫБРАН РАНЬШЕ ----------
  if (nick) {
    enterChat();
  } else {
    nickInput.focus();
  }

  // ---------- ПРЕДЗАГРУЗКА ИСТОРИИ В ПАМЯТИ ----------
  // (если игрок вернётся — увидит прошлые сообщения)
</script>

</body>
</html>
