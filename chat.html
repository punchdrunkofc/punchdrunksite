  // ---------- СОСТОЯНИЕ ----------
  let nick = localStorage.getItem(NICK_KEY) || null;
  let history = loadHistory();
  let fakeMsgIndex = 0;

  let replyTimer = null;

  const chatLog = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  const chatContainer = document.getElementById("chatContainer");

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch (e) { return []; }
  }
  function saveHistory() {
    const trimmed = history.slice(-200);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
  }

  function renderMessage(msg) {
    const div = document.createElement("div");
    div.className = "msg " + (msg.type || "");
    if (msg.own) div.classList.add("own");

    if (msg.type === "system") {
      div.innerHTML = msg.text;
    } else {
      const time = msg.time ? `<span class="time">${msg.time}</span>` : "";
      div.innerHTML = `<span class="nick">${escapeHtml(msg.nick)}:</span> <span class="text">${escapeHtml(msg.text)}</span>${time}`;
    }
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[m]);
  }

  function nowHHMM() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  let AC = null;
  function beep(freq, dur, vol) {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      const c = AC, t = c.currentTime;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.04, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / 1000);
      osc.connect(g).connect(c.destination);
      osc.start(t);
      osc.stop(t + dur / 1000 + 0.02);
    } catch (e) {}
  }

  function enterChat() {

    updateOnline();
    setInterval(updateOnline, 45000);

    const msg = { nick, text, time: nowHHMM(), type: "msg" };
    history.push(msg);
    saveHistory();
    renderMessage(msg);

    beep(1400, 30, 0.02);

  // ---------- ДИАЛОГ МЕЖДУ "ДРУГИМИ" ----------
  function playDialogue(dialogue) {
    let delay = 0;
    dialogue.forEach((line, i) => {
      setTimeout(() => {
        const nick = FAKE_USERS[line.user % FAKE_USERS.length];
        const msg = { nick, text: line.text, time: nowHHMM(), type: "msg" };
        history.push(msg);
        saveHistory();
        renderMessage(msg);
        beep(1200 + Math.random() * 400, 30, 0.02);
      }, delay);

      // задержка между репликами: 1.5–3 секунды
      delay += 1500 + Math.random() * 1500;
    });
  }

  function scheduleDialogue() {
    if (dialogueTimer) clearTimeout(dialogueTimer);

    // пауза 25–60 секунд между диалогами
    const delay = 25000 + Math.random() * 35000;

    dialogueTimer = setTimeout(() => {
      const dialogue = AMBIENT_DIALOGUES[dialogueIndex % AMBIENT_DIALOGUES.length];
      dialogueIndex++;
      playDialogue(dialogue);
      scheduleDialogue();
    }, delay);
  }

  // ---------- РЕАКЦИЯ НА СООБЩЕНИЕ ИГРОКА ----------

    const lower = text.toLowerCase().trim();

    const words = lower.split(/\s+/);
    for (let len = Math.min(3, words.length); len >= 1; len--) {

        const phrase = words.slice(i, i + len).join(" ");

          const reply = pool[Math.floor(Math.random() * pool.length)]

        "keep going.",
        "you are not alone.",
        "we have been waiting.",
        "do not stop.",
        "we are still here.",
        "…",
        "say more",
        "we are listening"
      ];
      const reply = genericReplies[Math.floor(Math.random() * genericReplies.length)];
      scheduleFakeReply(reply, 2000 + Math.random() * 3000);
    }
  }

  function scheduleFakeReply(text, delay) {
    if (replyTimer) clearTimeout(replyTimer);
    replyTimer = setTimeout(() => {
      const nick = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
      const msg = { nick, text, time: nowHHMM(), type: "msg" };
      history.push(msg);
      saveHistory();
      renderMessage(msg);
      beep(1200, 40, 0.025);
    }, delay);
  }

  // ---------- ФОНОВЫЕ ОДИНОЧНЫЕ (реже) ----------
  function scheduleAmbient() {
    if (ambientTimer) clearTimeout(ambientTimer);
    const delay = 20000 + Math.random() * 30000;
    ambientTimer = setTimeout(() => {
      if (Math.random() < 0.35) {
        addFakeMessage();
      }
      if (Math.random() < 0.12) {
        const whispers = [
          "someone is typing...",
          "it is very quiet in here",
          "who joined?",
          "the signal changed",
          "we are being watched",
          "i see a new name",
          "the wheel moved"
        ];
        const w = whispers[Math.floor(Math.random() * whispers.length)];
        renderMessage({ type: "msg whisper", nick: "system", text: w });
      }
      scheduleAmbient();
    }, delay);
  }

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    const msg = {
      nick: nick,
      text: text,
      time: nowHHMM(),
      type: "msg",
      own: true
    };
    history.push(msg);
    saveHistory();
    renderMessage(msg);
    beep(880, 40, 0.03);
    chatInput.value = "";
    reactToMessage(text);
  }

  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  nickBtn.addEventListener("click", () => {
    const v = nickInput.value.trim();
    if (!v) return;
    if (v.length > 16) return;
    nick = v;
    localStorage.setItem(NICK_KEY, nick);
    beep(660, 80, 0.04);
    enterChat();
  });

  nickInput.addEventListener("keydown", e => {
    if (e.key === "Enter") nickBtn.click();
  });

  if (nick) {
    enterChat();
  } else {
    nickInput.focus();
  }
</script>

</body>
</html>
